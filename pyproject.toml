[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "neftecode-hackathon"
version = "0.1.0"
description = "Neftecode hackathon project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
neftecode-hackathon = "neftecode_hackathon:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
